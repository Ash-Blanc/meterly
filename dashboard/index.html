<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Oracle — Cost-Aware Sidecar</title>
<style>
  :root {
    --bg: #09090b;
    --panel: #101014;
    --panel-raised: #16161c;
    --border: rgba(255, 255, 255, 0.06);
    --text: #fafafa;
    --dim: #71717a;
    --accent: #f59e0b;
    --accent-dim: rgba(245, 158, 11, 0.12);
    --green: #34d399;
    --red: #f87171;
    --blue: #60a5fa;
    /* Emil's curves — strong, intentional */
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
    --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, monospace;
    font-size: 14px;
    min-height: 100vh;
    padding: 32px clamp(16px, 4vw, 48px);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- header ---------- */
  .header {
    display: flex; justify-content: space-between; align-items: flex-end;
    flex-wrap: wrap; gap: 20px; margin-bottom: 28px;
  }
  .logo { font-size: 15px; font-weight: 600; letter-spacing: 0.2em; color: var(--text); }
  .logo .glyph { color: var(--accent); margin-right: 10px; }
  .logo em { font-style: normal; color: var(--dim); letter-spacing: 0.35em; font-size: 11px; margin-left: 12px; }
  .live-dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--green); margin-left: 10px; vertical-align: middle;
    box-shadow: 0 0 8px var(--green);
  }

  /* ---------- stat cards ---------- */
  .ticker { display: flex; gap: 12px; }
  .stat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 22px 18px;
    min-width: 190px;
    box-shadow: 0 1px 2px rgba(0,0,0,.2), 0 8px 24px rgba(0,0,0,.25);
  }
  .stat .label {
    font-size: 10px; color: var(--dim);
    text-transform: uppercase; letter-spacing: 0.14em;
  }
  .stat .value {
    font-size: 30px; font-weight: 650; margin-top: 6px;
    font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
  }
  .stat .bar {
    height: 3px; background: rgba(255,255,255,.06);
    border-radius: 2px; margin-top: 12px; overflow: hidden;
  }
  .stat .bar-fill {
    height: 100%; width: 0%;
    background: var(--green); border-radius: 2px;
    transition: width 500ms var(--ease-out), background 300ms var(--ease-out);
  }
  .stat.warn .bar-fill { background: var(--accent); }
  .stat.over .bar-fill { background: var(--red); }
  .stat.over .value { color: var(--red); }
  .stat.warn .value { color: var(--accent); }

  /* ---------- grid panels ---------- */
  .grid {
    display: grid; grid-template-columns: 1.2fr 1fr;
    gap: 16px; align-items: start;
  }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px; padding: 20px;
    box-shadow: 0 1px 2px rgba(0,0,0,.2), 0 8px 24px rgba(0,0,0,.25);
  }
  .panel h2 {
    font-size: 10px; color: var(--dim); font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.14em; margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .panel h2 .count {
    background: rgba(255,255,255,.06); border-radius: 99px;
    padding: 2px 8px; font-size: 10px; color: var(--dim);
    font-variant-numeric: tabular-nums;
  }

  /* ---------- event feed ---------- */
  .feed { display: flex; flex-direction: column; gap: 6px; max-height: 380px; overflow-y: auto; }
  .feed::-webkit-scrollbar { width: 4px; }
  .feed::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 2px; }
  .event {
    padding: 10px 14px; border-radius: 10px;
    background: rgba(255,255,255,.025);
    border-left: 2px solid var(--blue);
    font-size: 12.5px; line-height: 1.5;
    display: flex; justify-content: space-between; gap: 12px; align-items: baseline;
  }
  .event.spend { border-left-color: var(--green); }
  .event.approval { border-left-color: var(--accent); background: var(--accent-dim); }
  .event.denied { border-left-color: var(--red); }
  .event .time { color: var(--dim); font-size: 10.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .event .amt { font-variant-numeric: tabular-nums; font-weight: 600; }

  /* ---------- report ---------- */
  .report-total {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 4px 0 14px; border-bottom: 1px solid var(--border); margin-bottom: 10px;
  }
  .report-total .big { font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .report-row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 7px 0; font-size: 12.5px; gap: 12px;
  }
  .report-row + .report-row { border-top: 1px solid rgba(255,255,255,.04); }
  .report-row .name { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .report-row .val { font-variant-numeric: tabular-nums; }
  .report-section { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.14em; margin: 14px 0 4px; }
  .empty { color: var(--dim); font-size: 12.5px; padding: 12px 0; }

  /* ---------- approval modal ---------- */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    visibility: hidden; opacity: 0;
  }
  .modal-overlay.show { visibility: visible; opacity: 1; }
  .modal {
    background: var(--panel-raised);
    border: 1px solid rgba(245, 158, 11, 0.35);
    border-radius: 18px; padding: 32px;
    max-width: 460px; width: calc(100% - 32px);
    box-shadow: 0 24px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.03) inset,
                0 0 80px rgba(245, 158, 11, 0.08);
    transform-origin: center; /* modals stay centered — Emil's exception */
  }
  .modal .tag {
    font-size: 10px; color: var(--accent); font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.22em;
    display: flex; align-items: center; gap: 8px;
  }
  .modal .tag::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 10px var(--accent);
  }
  .modal .action { font-size: 15px; margin: 16px 0 4px; line-height: 1.6; color: var(--text); }
  .modal .cost {
    font-size: 40px; font-weight: 700; color: var(--accent);
    margin: 10px 0; font-variant-numeric: tabular-nums; letter-spacing: -0.03em;
  }
  .modal .reason { color: var(--dim); font-size: 12.5px; line-height: 1.6; margin-bottom: 24px; }
  .modal .buttons { display: flex; gap: 10px; }
  .btn {
    flex: 1; padding: 13px 16px; border: none; border-radius: 10px;
    font-size: 13.5px; font-weight: 600; cursor: pointer; font-family: inherit;
    transition: transform 160ms var(--ease-out), background 160ms var(--ease-out),
                box-shadow 160ms var(--ease-out);
  }
  .btn:active { transform: scale(0.97); }
  .btn-approve {
    background: var(--green); color: #052e1b;
    box-shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(52, 211, 153, 0.15);
  }
  @media (hover: hover) and (pointer: fine) {
    .btn-approve:hover { box-shadow: 0 2px 4px rgba(0,0,0,.3), 0 6px 24px rgba(52, 211, 153, 0.25); }
  }
  .btn-deny {
    background: transparent; color: var(--red);
    border: 1px solid rgba(248, 113, 113, 0.35);
  }
  @media (hover: hover) and (pointer: fine) {
    .btn-deny:hover { background: rgba(248, 113, 113, 0.08); }
  }
  .btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  /* keyboard shortcut hints */
  .kbd {
    display: inline-block; padding: 1px 6px; border-radius: 5px;
    border: 1px solid rgba(255,255,255,.12); border-bottom-width: 2px;
    font-size: 10px; color: var(--dim); margin-left: 8px; vertical-align: 1px;
    background: rgba(255,255,255,.04);
  }

  /* entrance starting styles (transitions, not keyframes — interruptible) */
  .stagger-item { opacity: 0; transform: translateY(8px); }
</style>
</head>
<body>
  <header class="header">
    <div class="logo stagger-item"><span class="glyph">◈</span>ORACLE<em>SIDECAR</em><span class="live-dot" id="liveDot"></span></div>
    <div class="ticker">
      <div class="stat stagger-item" id="sessionStat">
        <div class="label">Session Spend</div>
        <div class="value" id="sessionSpend">$0.00</div>
        <div class="bar"><div class="bar-fill" id="sessionBar"></div></div>
      </div>
      <div class="stat stagger-item" id="dailyStat">
        <div class="label">Daily Spend</div>
        <div class="value" id="dailySpend">$0.00</div>
        <div class="bar"><div class="bar-fill" id="dailyBar"></div></div>
      </div>
    </div>
  </header>

  <main class="grid">
    <section class="panel stagger-item">
      <h2>Live Event Feed <span class="count" id="eventCount">0</span></h2>
      <div class="feed" id="feed"><div class="empty">Waiting for agent activity…</div></div>
    </section>
    <section class="panel stagger-item">
      <h2>Spend Report</h2>
      <div id="report"><div class="empty">No spend recorded yet.</div></div>
    </section>
  </main>

  <div class="modal-overlay" id="approvalModal" role="dialog" aria-modal="true" aria-labelledby="approvalTitle">
    <div class="modal">
      <div class="tag" id="approvalTitle">Approval Required</div>
      <div class="action" id="approvalAction"></div>
      <div class="cost" id="approvalCost"></div>
      <div class="reason" id="approvalReason"></div>
      <div class="buttons">
        <button class="btn btn-approve" id="approveBtn">Approve &amp; Proceed<span class="kbd">↵</span></button>
        <button class="btn btn-deny" id="denyBtn">Deny<span class="kbd">esc</span></button>
      </div>
    </div>
  </div>

<script src="./gsap.min.js"></script>
<script>
const API = ''; // same origin — dashboard is served by the MCP server itself
let currentApprovalId = null;
let eventCount = 0;

/* ---------- entrance: staggered, ease-out, fast (Emil: 30-80ms stagger, <300ms) ---------- */
const mm = gsap.matchMedia();
mm.add('(prefers-reduced-motion: no-preference)', () => {
  gsap.to('.stagger-item', {
    opacity: 1, y: 0,
    duration: 0.28,
    ease: 'power2.out',
    stagger: 0.06,
    overwrite: 'auto',
  });
});
mm.add('(prefers-reduced-motion: reduce)', () => {
  gsap.set('.stagger-item', { opacity: 1, y: 0 });
});

/* ---------- live event stream ---------- */
const es = new EventSource(`${API}/events`);
es.onopen = () => gsap.to('#liveDot', { opacity: 1, duration: 0.2 });
es.onerror = () => gsap.to('#liveDot', { opacity: 0.25, duration: 0.2 });
es.onmessage = (e) => {
  const ev = JSON.parse(e.data);
  if (ev.type === 'approval_requested') showApproval(ev);
  if (ev.type === 'spend_logged') { addFeed(ev, 'spend'); refreshStatus(); }
  if (ev.type === 'approval_resolved') addFeed(ev, ev.approved ? 'approval' : 'denied');
};

/* ---------- approval modal (GSAP-driven, interruptible) ---------- */
let modalTl = null;
function showApproval(ev) {
  currentApprovalId = ev.approvalId;
  document.getElementById('approvalAction').textContent = ev.action;
  document.getElementById('approvalCost').textContent = `$${ev.estimatedCostUsd.toFixed(4)}`;
  document.getElementById('approvalReason').textContent = ev.reason || 'No reason provided.';
  const overlay = document.getElementById('approvalModal');
  overlay.classList.add('show');

  mm.add('(prefers-reduced-motion: no-preference)', () => {
    modalTl?.kill();
    modalTl = gsap.timeline()
      // enter from scale(0.95) + opacity — never scale(0); 250ms ease-out
      .fromTo('.modal',
        { scale: 0.95, autoAlpha: 0, y: 6 },
        { scale: 1, autoAlpha: 1, y: 0, duration: 0.25, ease: 'power2.out' });
    // count-up via proxy object (GSAP can't tween textContent directly)
    const counter = { v: 0 };
    gsap.to(counter, {
      v: ev.estimatedCostUsd, duration: 0.45, ease: 'power1.out',
      onUpdate: () => document.getElementById('approvalCost').textContent = `$${counter.v.toFixed(4)}`,
    });
  });
  document.getElementById('approveBtn').focus();
}

function hideModal() {
  const overlay = document.getElementById('approvalModal');
  // exit FASTER than enter (Emil: asymmetric timing)
  gsap.to('.modal', {
    scale: 0.97, autoAlpha: 0, y: 4,
    duration: 0.15, ease: 'power2.in',
    onComplete: () => overlay.classList.remove('show'),
  });
}

async function resolveApproval(approved) {
  if (!currentApprovalId) return;
  const id = currentApprovalId;
  currentApprovalId = null;
  hideModal();
  await fetch(`${API}/approvals/${id}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ approved }),
  });
}

document.getElementById('approveBtn').addEventListener('click', () => resolveApproval(true));
document.getElementById('denyBtn').addEventListener('click', () => resolveApproval(false));
// keyboard: no animation on keyboard-initiated actions (Emil) — they just trigger the buttons
window.addEventListener('keydown', (e) => {
  if (!currentApprovalId) return;
  if (e.key === 'Enter') { e.preventDefault(); resolveApproval(true); }
  if (e.key === 'Escape') { e.preventDefault(); resolveApproval(false); }
});

/* ---------- feed ---------- */
function addFeed(ev, cls) {
  const feed = document.getElementById('feed');
  feed.querySelector('.empty')?.remove();
  const div = document.createElement('div');
  div.className = `event ${cls}`;
  const time = new Date().toLocaleTimeString([], { hour12: false });
  let html = '';
  if (ev.type === 'approval_requested')
    html = `<span>⏸ Approval requested — ${escapeHtml(ev.action)}</span><span class="amt">$${ev.estimatedCostUsd.toFixed(4)}</span>`;
  if (ev.type === 'approval_resolved')
    html = ev.approved ? `<span>✓ Approved</span>` : `<span>✕ Denied</span>`;
  if (ev.type === 'spend_logged')
    html = `<span>◈ ${escapeHtml(ev.taskDescription.slice(0, 64))}</span><span class="amt">$${ev.costUsd.toFixed(4)}</span>`;
  div.innerHTML = `${html}<span class="time">${time}</span>`;
  feed.prepend(div);
  eventCount++;
  document.getElementById('eventCount').textContent = eventCount;
  // enter: opacity + translateY, ease-out, fast
  gsap.fromTo(div, { opacity: 0, y: -6 }, { opacity: 1, y: 0, duration: 0.2, ease: 'power2.out' });
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- status: tween the numbers (perceived precision) ---------- */
const displayed = { session: 0, daily: 0 };
async function refreshStatus() {
  const { budget, report } = await fetch(`${API}/status`).then(r => r.json());

  tweenMoney('#sessionSpend', 'session', budget.sessionSpentUsd);
  tweenMoney('#dailySpend', 'daily', budget.dailySpentUsd);

  document.getElementById('sessionBar').style.width = `${Math.min(100, budget.sessionPctUsed)}%`;
  document.getElementById('dailyBar').style.width = `${Math.min(100, budget.dailyPctUsed)}%`;
  document.getElementById('sessionStat').className =
    'stat' + (budget.overBudget ? ' over' : budget.warning ? ' warn' : '');
  document.getElementById('dailyStat').className =
    'stat' + (budget.dailyPctUsed >= 100 ? ' over' : budget.dailyPctUsed >= 80 ? ' warn' : '');

  renderReport(report);
}

function tweenMoney(selector, key, target) {
  const el = document.querySelector(selector);
  const counter = { v: displayed[key] };
  gsap.to(counter, {
    v: target, duration: 0.5, ease: 'power1.out', overwrite: 'auto',
    onUpdate: () => { el.textContent = `$${counter.v.toFixed(2)}`; displayed[key] = counter.v; },
  });
}

function renderReport(report) {
  const el = document.getElementById('report');
  if (report.totalUsd === 0) { el.innerHTML = '<div class="empty">No spend recorded yet.</div>'; return; }
  const models = Object.entries(report.byModel)
    .map(([m, c]) => `<div class="report-row"><span class="name">${escapeHtml(m)}</span><span class="val">$${c.toFixed(4)}</span></div>`).join('');
  const tasks = report.topTasks
    .map(t => `<div class="report-row"><span class="name">${escapeHtml(t.task)}</span><span class="val">$${t.costUsd.toFixed(4)}</span></div>`).join('');
  el.innerHTML = `
    <div class="report-total"><span class="label" style="font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.14em">Total</span><span class="big">$${report.totalUsd.toFixed(4)}</span></div>
    <div class="report-section">By model</div>${models}
    <div class="report-section">Top tasks</div>${tasks}`;
}

refreshStatus();
setInterval(refreshStatus, 5000);
</script>
</body>
</html>
